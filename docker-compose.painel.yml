# =============================================================================
# Overlay do PAINEL (Máquina A) sobre o docker-compose.prod.yml.
#
# Publica Postgres e Redis SÓ na interface WireGuard (10.8.0.1), para o braço
# (Máquina B) alcançá-los pelo túnel criptografado — NUNCA na internet pública.
# Por isso o bind é no IP do wg0, não em 0.0.0.0.
#
# Uso no painel:
#   docker compose -f docker-compose.prod.yml -f docker-compose.painel.yml up -d
# =============================================================================

services:
  db:
    ports:
      - "${WG_IP:-10.8.0.1}:5432:5432"
  redis:
    ports:
      - "${WG_IP:-10.8.0.1}:6379:6379"
